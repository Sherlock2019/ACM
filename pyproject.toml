[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acm"
version = "0.1.0"
description = "Actions Consequential Model - what an action changes for the actor, others, the environment, society and the earth; built on the Meaning Language Model"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # The Meaning Language Model (package name splm). Not on PyPI: install it first
    # from a local checkout (pip install -e ../SLM) or from its Git repository.
    "splm",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Planned physics backend (acm.world.PyBulletSimulator raises BackendUnavailable until integrated).
physics = ["pybullet>=3.2"]
# Live image/video extraction comes from MLM: pip install "splm[vision]".

[project.scripts]
acm = "acm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
