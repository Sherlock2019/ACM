# Place gazetteer: the blast radius of an action beyond the place it happens in.
#
# For every place an action happens at (WHERE), ACM looks it up here to fill the
# outer layers of the report:
#
#   neighbours    NEIGHBOUR layer     - the places next to it, where effects spill over
#   organization  ORGANIZATION layer  - the businesses, enterprises, institutions and
#                                       systems the place belongs to or is run by,
#                                       which feel the action without being there
#   city          CITY layer          - the city it is in (a city is its own city)
#   country       COUNTRY layer       - the country it is in (taken from its city if not given)
#
# kind is one of: site, business, enterprise, system, city, region, country.
# `city` and `country` are keys of other entries, checked when the packs load.
# Keys and aliases are matched against ACM's entity keys: the full lower-cased text
# for named places ("paris", "new york"), the head lemma for common nouns
# ("production", "factory").
#
# A place that is not listed here still gets its local environment; its other
# layers are reported as unknown - never guessed.
#
# A seed list, not an atlas.

version: 1

places:
  # -- countries -------------------------------------------------------------
  france:
    kind: country
    name: France
    neighbours: [Belgium, Germany, Switzerland, Italy, Spain]
    organization: [French government, European Union]
  united kingdom:
    kind: country
    name: United Kingdom
    aliases: [uk, britain, royaume-uni]
    neighbours: [Ireland, France across the Channel]
    organization: [UK government, Commonwealth]
  united states:
    kind: country
    name: United States
    aliases: [usa, us, états-unis]
    neighbours: [Canada, Mexico]
    organization: [US federal government]
  vietnam:
    kind: country
    name: Vietnam
    aliases: [viet nam, việt nam]
    neighbours: [China, Laos, Cambodia]
    organization: [Vietnamese government, ASEAN]

  # -- cities ------------------------------------------------------------------
  paris:
    kind: city
    name: Paris
    country: france
    neighbours: [Boulogne-Billancourt, Saint-Denis, Montreuil]
    organization: [Paris city council, Île-de-France regional council, Paris businesses and employers]
  lyon:
    kind: city
    name: Lyon
    country: france
    neighbours: [Villeurbanne, Vénissieux]
    organization: [Métropole de Lyon, Lyon businesses and employers]
  london:
    kind: city
    name: London
    country: united kingdom
    aliases: [londres]
    neighbours: [Croydon, Watford, Slough]
    organization: [Greater London Authority, City of London financial firms]
  new york:
    kind: city
    name: New York
    country: united states
    aliases: [nyc, new york city]
    neighbours: [Jersey City, Newark, Yonkers]
    organization: [New York City government, Wall Street financial firms]
  hanoi:
    kind: city
    name: Hanoi
    country: vietnam
    aliases: [hà nội, ha noi]
    neighbours: [Bắc Ninh, Hưng Yên]
    organization: [Hanoi People's Committee, Hanoi businesses and employers]
  ho chi minh city:
    kind: city
    name: Ho Chi Minh City
    country: vietnam
    aliases: [saigon, sài gòn]
    neighbours: [Bình Dương, Đồng Nai]
    organization: [Ho Chi Minh City People's Committee, Saigon businesses and employers]

  # -- sites, businesses, enterprises, systems --------------------------------
  # Common nouns: no fixed city or country, so those layers come from a named
  # place in the same sentence, if any.
  production:
    kind: system
    name: production
    neighbours: [staging and test environments]
    organization: [the enterprise that runs it, its customers and users, services that call it]
  office:
    kind: business
    name: office
    neighbours: [neighbouring offices and shops]
    organization: [the company, its employees, its clients]
  shop:
    kind: business
    name: shop
    aliases: [store]
    neighbours: [neighbouring shops and residents]
    organization: [the retailer, its suppliers, its customers]
  factory:
    kind: business
    name: factory
    neighbours: [residents near the site]
    organization: [the enterprise that owns it, its suppliers, its customers]
  company:
    kind: enterprise
    name: company
    neighbours: [competitors in the same market]
    organization: [its employees, its shareholders, its customers, its suppliers]
  airport:
    kind: site
    name: airport
    neighbours: [communities under the flight paths]
    organization: [the airport operator, airlines, the city it serves]
  hospital:
    kind: site
    name: hospital
    neighbours: [residents and businesses nearby]
    organization: [the hospital trust, the regional health system, its patients]
  school:
    kind: site
    name: school
    neighbours: [families living nearby]
    organization: [the education authority, its pupils and staff]
